<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#fff3e0">
<title>Thor Events</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #fff3e0;
    --card: #ffffff;
    --ink: #33302e;
    --muted: #8a7f74;
    --red: #e23636;
    --gold: #f5a623;
    --line: #f3d9b8;
    --shadow: 0 6px 0 rgba(51,48,46,.08);
    --radius: 22px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Nunito", -apple-system, sans-serif; font-weight: 500;
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(rgba(226,54,54,.05) 2px, transparent 2px);
    background-size: 26px 26px;
    min-height: 100vh;
  }
  main { max-width: 640px; margin: 0 auto; padding: 48px 16px 64px; }
  h1 {
    font-family: "Fredoka", sans-serif; font-weight: 700;
    font-size: clamp(32px, 8vw, 44px); margin: 0 0 6px; color: var(--red);
  }
  .sub { margin: 0 0 32px; color: var(--muted); font-size: 17px; }
  .grid { display: grid; gap: 16px; }
  a.card {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 2px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 20px; color: inherit; text-decoration: none;
    transition: transform .12s, border-color .12s;
  }
  a.card:hover, a.card:focus-visible { transform: translateY(-2px); border-color: var(--gold); outline: none; }
  .emoji { font-size: 40px; line-height: 1; flex: none; }
  .card h2 { font-family: "Fredoka", sans-serif; font-weight: 600; font-size: 22px; margin: 0 0 4px; }
  .card p { margin: 0; color: var(--muted); }
  .arrow { margin-left: auto; font-size: 22px; color: var(--gold); flex: none; }
</style>
</head>
<body>
<main>
  <h1>Thor Events</h1>
  <p class="sub">Everything in one place.</p>
  <div class="grid">
    <a class="card" href="activities/">
      <span class="emoji">🦸</span>
      <div>
        <h2>Thor's Bangkok Adventures</h2>
        <p>Weekly workshops, events and things to do with Thor.</p>
      </div>
      <span class="arrow">→</span>
    </a>
    <a class="card" href="lucky-draw/">
      <span class="emoji">🎁</span>
      <div>
        <h2>Lucky Draw · จับรางวัล</h2>
        <p>Prize draw for events.</p>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
</main>
</body>
</html>
