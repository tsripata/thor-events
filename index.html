<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thor Events</title>
<style>
  body { font-family: -apple-system, "Segoe UI", sans-serif; margin: 0; background: #0f1115; color: #e8eaed; }
  header { padding: 4rem 2rem 2rem; text-align: center; }
  h1 { margin: 0; font-size: 2.5rem; }
  p.tagline { color: #9aa0a6; }
  main { max-width: 720px; margin: 0 auto; padding: 1rem 2rem 4rem; }
  .event { background: #1a1d24; border-radius: 12px; padding: 1.25rem 1.5rem; margin-bottom: 1rem; }
  .event h2 { margin: 0 0 .25rem; font-size: 1.2rem; }
  .event .meta { color: #9aa0a6; font-size: .9rem; }
</style>
</head>
<body>
<header>
  <h1>⚡ Thor Events</h1>
  <p class="tagline">Upcoming events — site under construction</p>
</header>
<main>
  <div class="event">
    <h2>First event coming soon</h2>
    <div class="meta">Check back shortly</div>
  </div>
</main>
</body>
</html>
