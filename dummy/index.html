<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dummy Page</title>
<style>
:root{--bg:#0b1020;--card:#1b2444;--line:#2c3763;--txt:#f2f5ff;--dim:#93a0c8;--gold:#ffd24a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 700px at 50% -10%,#26325e 0%,var(--bg) 60%);
  color:var(--txt);font-family:'Sarabun','Noto Sans Thai',Tahoma,sans-serif;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px;max-width:480px;text-align:center}
h1{margin:0 0 8px;color:var(--gold)}
p{margin:0;color:var(--dim)}
</style>
</head>
<body>
<div class="card">
  <h1>Hello from Thor Events</h1>
  <p>This is a dummy page to test GitHub Pages publishing.</p>
</div>
</body>
</html>
