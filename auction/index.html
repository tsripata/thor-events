<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f6f0dc">
<title>ประมูลการกุศล — ตลาดน้ำจิตน้ำใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#f6f0dc;
  --paper-2:#fffaf0;
  --ink:#3b2f27;
  --dim:#857766;
  --red:#e2553f;
  --red-deep:#c23b28;
  --orange:#e8774d;
  --olive:#7f8f52;
  --lemon:#e9ea8c;
  --lemon-2:#f2f2b4;
  --ring:#a3a9c6;
  --wood:#9a4423;
  --wood-2:#b9592e;
  --pink:#f3a7a3;
  --shadow:0 6px 0 rgba(59,47,39,.10);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Sarabun",-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;
  min-height:100vh;overflow-x:hidden;
}
a{color:var(--red-deep)}
button{font:inherit;cursor:pointer}
.hand{font-family:"Mali","Sarabun",cursive}

/* ---------- bunting ---------- */
.bunting{display:block;width:100%;height:64px}

/* ---------- header ---------- */
header{max-width:1120px;margin:0 auto;padding:4px 16px 8px;text-align:center}
.event{margin:0;color:var(--olive);font-size:clamp(18px,4.4vw,24px);font-weight:600}
h1{margin:2px 0 4px;font-size:clamp(30px,8vw,48px);line-height:1.15;color:var(--red);font-weight:700}
.status{
  display:inline-flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:6px 12px;
  margin:14px 0 0;padding:8px 14px;border-radius:999px;background:var(--paper-2);
  border:2px solid #eadfc2;font-size:14px;color:var(--dim)
}
.dot{width:9px;height:9px;border-radius:50%;background:#5aa469;box-shadow:0 0 0 0 rgba(90,164,105,.6);animation:pulse 2s infinite}
.dot.off{background:#c9b9a3;animation:none}
.dot.err{background:var(--red);animation:none}
@keyframes pulse{70%{box-shadow:0 0 0 8px rgba(90,164,105,0)}100%{box-shadow:0 0 0 0 rgba(90,164,105,0)}}
.status button{border:0;background:none;color:var(--red-deep);font-weight:600;padding:0}
.countdown{
  margin:14px auto 0;display:inline-block;padding:10px 18px;border-radius:16px;
  background:var(--red);color:#fff;font-weight:700;box-shadow:var(--shadow)
}
.countdown.closed{background:var(--olive)}
.countdown[hidden]{display:none}
.countdown b{font-size:1.25em;letter-spacing:.02em}


main{max-width:1120px;margin:0 auto;padding:12px 16px 72px}

/* ---------- banners ---------- */
.banner{margin:12px 0;padding:12px 14px;border-radius:14px;font-size:15px}
.banner.err{background:#fbe6e2;color:#8c2618;border:2px solid #f3c2b8}
.banner.info{background:#eef0dc;color:#4f5a2f;border:2px solid #d9ddb5}
.banner:empty{display:none}


/* ---------- lots ---------- */
.lots-head{display:flex;align-items:end;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px}
.lots-head select{
  font:inherit;font-size:14px;padding:6px 10px;border-radius:10px;border:2px solid #eadfc2;
  background:var(--paper-2);color:var(--ink)
}
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.controls label{display:flex;align-items:center;gap:6px;white-space:nowrap;font-size:14px;color:var(--dim);min-width:0}
#pick{width:min(420px,100%);min-width:0;text-overflow:ellipsis}
.controls label:first-child{flex:1 1 260px;max-width:480px}
@media (max-width:560px){.controls{width:100%}.controls label{width:100%}.controls select{flex:1;width:auto}}
.show-all{border:0;background:none;color:var(--red-deep);font-weight:600;padding:0}
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin-top:10px}
.lot{
  position:relative;background:var(--paper-2);border-radius:22px;padding:18px 14px 14px;
  box-shadow:var(--shadow);border:2px solid #eadfc2;display:flex;flex-direction:column
}
.lot.bump{animation:bump 1.4s ease}
@keyframes bump{
  0%{transform:scale(1)}15%{transform:scale(1.035) rotate(-.6deg);border-color:var(--red)}
  30%{transform:scale(1) rotate(.4deg)}100%{transform:none;border-color:#eadfc2}
}
@keyframes pop{0%{transform:scale(.6);opacity:0}70%{transform:scale(1.08)}100%{transform:none;opacity:1}}
.photo{
  position:relative;width:150px;height:150px;margin:0 auto;border-radius:50%;
  border:7px solid var(--ring);background:#fff;overflow:visible
}
.photo .inner{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center;font-size:58px}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo{display:block;text-decoration:none}
.bow{position:absolute;right:-6px;bottom:-4px;font-size:32px;transform:rotate(12deg)}
.photo .count{position:absolute;left:-8px;bottom:2px;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.board h3 a{color:inherit;text-decoration:none}
.board h3 a:hover{text-decoration:underline}
.plank{
  position:relative;z-index:1;align-self:center;margin:14px 0 -12px;padding:4px 18px 6px;
  background:linear-gradient(180deg,var(--wood-2),var(--wood));color:#fff6ea;
  border-radius:8px 14px 9px 12px;transform:rotate(-2deg);box-shadow:0 3px 0 rgba(0,0,0,.15);
  font-family:"Mali",cursive;font-weight:600;font-size:15px
}
.plank b{font-size:20px;margin-left:4px}
.board{
  background:var(--lemon);border:7px solid var(--wood);border-radius:6px;
  padding:20px 14px 14px;flex:1;display:flex;flex-direction:column;gap:6px
}
.board h3{margin:0;font-family:"Mali",cursive;font-size:20px;line-height:1.3}
.desc{margin:0;font-size:14px;color:#5b4f3d;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.donor{margin:0;font-size:13px;color:#6d6047}
.price{margin-top:6px;padding:8px 10px;border-radius:12px;background:var(--lemon-2)}
.price .lbl{font-size:13px;color:#6d6047}
.price .amt{font-family:"Mali",cursive;font-weight:700;font-size:30px;line-height:1.15;color:var(--red-deep)}
.price .amt small{font-size:15px;font-weight:600;color:#6d6047;margin-left:4px}
.leader{font-weight:600;font-size:15px;word-break:break-word}
.leader .sub{display:block;font-weight:400;font-size:13px;color:#6d6047}
.leader.none{color:#6d6047;font-weight:500}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:13px;color:#6d6047;flex-wrap:wrap}
.actions{display:flex;gap:8px;margin-top:8px}
.btn{
  flex:1;text-align:center;text-decoration:none;border-radius:12px;padding:10px 12px;font-weight:700;
  border:2px solid var(--wood);background:#fffaf0;color:var(--wood)
}
.btn.primary{background:var(--red);border-color:var(--red-deep);color:#fff}
.btn:hover,.btn:focus-visible{filter:brightness(1.05);outline:none;transform:translateY(-1px)}
.badge{
  position:absolute;top:10px;left:10px;background:var(--red);color:#fff;font-size:12px;font-weight:700;
  padding:3px 9px;border-radius:999px;transform:rotate(-6deg)
}
.badge.win{background:var(--olive)}
.badge.hot{background:var(--orange)}

/* ---------- toast ---------- */
.toasts{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);display:grid;gap:8px;z-index:20;width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:#fff;border-radius:14px;padding:10px 14px;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.2);animation:pop .4s ease}

footer{max-width:1120px;margin:0 auto;padding:0 16px 40px;color:var(--dim);font-size:13px;text-align:center}
.skeleton{color:var(--dim);text-align:center;padding:40px 0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<svg class="bunting" viewBox="0 0 1200 64" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 6 Q600 46 1200 6" fill="none" stroke="#e2553f" stroke-width="3"/>
  <g id="flags"></g>
</svg>

<header>
  <p class="event hand" id="eventName">ตลาดน้ำจิตน้ำใจ #25</p>
  <h1 class="hand">ประมูลการกุศล</h1>
  <div class="status" role="status" aria-live="polite">
    <span class="dot off" id="dot"></span>
    <span id="statusText">กำลังโหลด…</span>
    <button type="button" id="refreshBtn">รีเฟรช</button>
  </div>
  <div><div class="countdown" id="countdown" hidden></div></div>
</header>

<main>
  <div class="banner err" id="errBanner"></div>
  <div class="banner info" id="infoBanner"></div>

  <section>
    <div class="lots-head">
      <h2>🎁 ของประมูลทั้งหมด</h2>
      <div class="controls">
      <label>ดูของ
        <select id="pick" aria-label="เลือกของประมูล">
          <option value="">ทั้งหมด</option>
        </select>
      </label>
      <label>เรียงตาม
        <select id="sort">
          <option value="no">หมายเลข</option>
          <option value="price">ราคาสูงสุด</option>
          <option value="bids">ประมูลบ่อยสุด</option>
          <option value="recent">มีคนประมูลล่าสุด</option>
          <option value="empty">ยังไม่มีคนประมูล</option>
        </select>
      </label>
      </div>
    </div>
    <div class="lots" id="lots"><p class="skeleton">กำลังโหลดของประมูล…</p></div>
  </section>
</main>

<footer>
  รายได้ทั้งหมดสมทบกิจกรรมการกุศล · ราคาในหน้านี้อ่านจาก Google Sheet แบบ real-time
  <span id="sheetLinkWrap" hidden> · <a id="sheetLink" target="_blank" rel="noopener">เปิดชีท</a></span>
</footer>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script src="auction-core.js"></script>
<script>
"use strict";

/* ==================================================================
   RENDER
   ================================================================== */
let model = null, prevLeaders = null, lastUpdated = null, loading = false, failStreak = 0;

function lotCard(s){
  const it = s.item, L = s.leader;
  const closed = endTime && Date.now() > endTime;
  const formLink = formUrl(it);
  const badge = closed && L ? `<span class="badge win">ผู้ชนะ 🏆</span>`
    : s.valid >= 5 ? `<span class="badge hot">ฮอต 🔥</span>`
    : !L ? `<span class="badge">ยังว่าง</span>` : "";
  const img = it.image
    ? `<img src="${esc(it.image)}" alt="${esc(it.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.replaceWith(document.createTextNode('${esc(it.emoji)}'))">`
    : esc(it.emoji);
  return `<article class="lot" data-key="${esc(it.key)}">
    ${badge}
    <a class="photo" href="${esc(itemPage(it))}" aria-label="ดูรายละเอียด ${esc(it.name)}"><div class="inner">${img}</div><span class="bow" aria-hidden="true">🎀</span>${it.images.length > 1 ? `<span class="count">📷 ${it.images.length}</span>` : ""}</a>
    <div class="plank">Item no.<b>${esc(it.no ? it.no.padStart(2, "0") : "–")}</b></div>
    <div class="board">
      <h3><a href="${esc(itemPage(it))}">${esc(it.name)}</a></h3>
      ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}
      ${it.donor ? `<p class="donor">💝 บริจาคโดย ${esc(it.donor)}</p>` : ""}
      <div class="price">
        <div class="lbl">${L ? (closed ? "ราคาที่ชนะ" : "ราคาสูงสุดตอนนี้") : it.start > 0 ? "ราคาเริ่มต้น" : "ราคาสูงสุดตอนนี้"}</div>
        <div class="amt">${L || it.start > 0 ? `${baht(L ? L.amount : it.start)}<small>บาท</small>` : "–"}</div>
        ${L ? `<div class="leader">👑 ${esc(L.who.main)}${L.who.sub ? `<span class="sub">${esc(L.who.sub)}</span>` : ""}</div>`
            : `<div class="leader none">ยังไม่มีใครประมูล เป็นคนแรกเลย!</div>`}
      </div>
      <div class="meta">
        <span>${s.valid} ครั้ง${s.lastAt ? ` · ${timeAgo(s.lastAt)}` : ""}</span>
        ${closed ? "<span>ปิดแล้ว</span>" : s.next > 0 ? `<span>ขั้นต่ำถัดไป <b>${baht(s.next)}</b></span>` : ""}
      </div>
      <div class="actions">
        ${formLink && !closed ? `<a class="btn primary" href="${esc(formLink)}" target="_blank" rel="noopener">ประมูลชิ้นนี้</a>` : ""}
        <a class="btn" href="${esc(itemPage(it))}">รายละเอียด</a>
      </div>
    </div>
  </article>`;
}

// Dropdown: "ทั้งหมด" + one option per item with its current top bid and leader. Keeps the selection across refreshes.
function fillPicker(lots){
  const sel = $("pick"), cur = sel.value;
  const no = s => parseInt(s.item.no, 10) || 9999;
  const opts = lots.slice().sort((a, b) => no(a) - no(b)).map(s => {
    const L = s.leader;
    const tail = L ? `${baht(L.amount)} บาท · ${L.who.main}` : `ยังไม่มีคนประมูล${s.item.start > 0 ? ` (เริ่ม ${baht(s.item.start)})` : ""}`;
    return `<option value="${esc(s.item.key)}">#${esc((s.item.no || "").padStart(2, "0"))} ${esc(s.item.name)} — ${esc(tail)}</option>`;
  });
  sel.innerHTML = `<option value="">ทั้งหมด (${lots.length} ชิ้น)</option>` + opts.join("");
  sel.value = lots.some(s => s.item.key === cur) ? cur : "";
}

function sortLots(lots){
  const by = $("sort").value;
  const arr = lots.slice();
  const no = s => parseInt(s.item.no, 10) || 9999;
  arr.sort((a, b) => no(a) - no(b));
  if (by === "price") arr.sort((a, b) => (b.leader ? b.leader.amount : -1) - (a.leader ? a.leader.amount : -1));
  if (by === "bids") arr.sort((a, b) => b.valid - a.valid);
  if (by === "recent") arr.sort((a, b) => (b.lastAt ? b.lastAt : 0) - (a.lastAt ? a.lastAt : 0));
  if (by === "empty") arr.sort((a, b) => (a.leader ? 1 : 0) - (b.leader ? 1 : 0));
  return arr;
}

function render(changed){
  const { lots, notes } = model;

  fillPicker(lots);
  const pick = $("pick").value;
  const shown = pick ? lots.filter(s => s.item.key === pick) : sortLots(lots);
  $("sort").disabled = !!pick;
  $("lots").innerHTML = lots.length ? shown.map(lotCard).join("")
    + (pick ? `<p class="skeleton"><button type="button" class="show-all" data-show-all>← ดูของทั้งหมด (${lots.length} ชิ้น)</button></p>` : "")
    : `<p class="skeleton">ยังไม่มีของประมูล เพิ่มรายการในแท็บ ${esc(CONFIG.ITEMS_SHEET)} ของชีท</p>`;
  changed.forEach(k => { const el = document.querySelector(`.lot[data-key="${CSS.escape(k)}"]`); if (el) el.classList.add("bump"); });

  const info = [];
  if (DEMO) info.push("โหมดตัวอย่าง: ข้อมูลในหน้านี้เป็นข้อมูลสมมติ ใส่ SHEET_ID ใน auction-core.js เพื่อเชื่อมกับชีทจริง");
  info.push(...notes);
  $("infoBanner").innerHTML = info.map(esc).join("<br>");
}

function toast(msg){
  const el = document.createElement("div");
  el.className = "toast"; el.textContent = msg;
  $("toasts").appendChild(el);
  setTimeout(() => el.remove(), 4500);
}

/* ==================================================================
   LOAD LOOP
   ================================================================== */
async function load(){
  if (loading) return;
  loading = true;
  $("statusText").textContent = "กำลังอัปเดต…";
  try {
    model = await fetchModel();

    const changed = new Set();
    const leaders = new Map(model.lots.map(s => [s.item.key, s.leader ? s.leader.amount : 0]));
    if (prevLeaders) {
      for (const s of model.lots) {
        if (s.leader && s.leader.amount > (prevLeaders.get(s.item.key) || 0)) {
          changed.add(s.item.key);
          toast(`🔔 #${(s.item.no || "").padStart(2, "0")} ${s.item.name}: ${s.leader.who.main} ให้ ${baht(s.leader.amount)} บาท!`);
        }
      }
    }
    prevLeaders = leaders;
    lastUpdated = new Date();
    failStreak = 0;
    $("errBanner").textContent = "";
    $("dot").className = "dot";
    render(changed);
  } catch (e) {
    failStreak++;
    $("dot").className = "dot err";
    $("errBanner").textContent = `โหลดข้อมูลไม่สำเร็จ: ${e.message}` + (model ? " (แสดงข้อมูลล่าสุดที่โหลดได้)" : "");
  } finally {
    loading = false;
    updateStatus();
  }
}

function updateStatus(){
  const parts = [];
  if (lastUpdated) parts.push(`อัปเดตล่าสุด ${clock(lastUpdated)}`);
  parts.push(`รีเฟรชเองทุก ${refreshLabel()}`);
  $("statusText").textContent = parts.join(" · ");
}

function tickCountdown(){
  const el = $("countdown");
  if (!endTime || isNaN(endTime)) { el.hidden = true; return; }
  el.hidden = false;
  const ms = endTime - Date.now();
  if (ms <= 0) {
    if (!el.classList.contains("closed") && model) render(new Set());
    el.classList.add("closed");
    el.innerHTML = "🏁 ปิดประมูลแล้ว ขอบคุณทุกคนที่ร่วมใจ!";
    return;
  }
  const s = Math.floor(ms / 1000);
  const d = Math.floor(s / 86400), h = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
  const pad = n => String(n).padStart(2, "0");
  el.innerHTML = `⏰ ปิดประมูลในอีก <b>${d ? d + " วัน " : ""}${pad(h)}:${pad(m)}:${pad(sec)}</b>`;
}

/* ==================================================================
   INIT
   ================================================================== */
(function drawBunting(){
  const colors = ["#e2553f", "#e9ea8c", "#7f8f52", "#e8774d", "#f3a7a3"];
  let html = "";
  for (let i = 0; i < 24; i++) {
    const x = i * 50 + 6, t = (x + 19) / 1200, y = 6 + 40 * 2 * t * (1 - t) * 1;
    html += `<path d="M${x} ${y.toFixed(1)} L${x + 38} ${y.toFixed(1)} L${x + 19} ${(y + 44).toFixed(1)} Z" fill="${colors[i % colors.length]}" opacity=".92"/>`;
  }
  $("flags").innerHTML = html;
})();

$("eventName").textContent = CONFIG.EVENT_NAME;
if (!DEMO) {
  $("sheetLink").href = `https://docs.google.com/spreadsheets/d/${CONFIG.SHEET_ID}/edit#gid=${CONFIG.BIDS_GID}`;
  $("sheetLinkWrap").hidden = false;
}
$("refreshBtn").addEventListener("click", load);
$("sort").addEventListener("change", () => model && render(new Set()));
$("pick").addEventListener("change", () => {
  if (!model) return;
  render(new Set());
  try { history.replaceState(null, "", $("pick").value ? `#item-${$("pick").value}` : location.pathname + location.search); } catch (e) {}
});
$("lots").addEventListener("click", e => {
  if (e.target.closest("[data-show-all]")) { $("pick").value = ""; $("pick").dispatchEvent(new Event("change")); }
});
// Deep link: …/auction/#item-3 opens with item 3 selected
const hashPick = /^#item-(.+)$/.exec(location.hash);
if (hashPick) $("pick").innerHTML += `<option value="${esc(decodeURIComponent(hashPick[1]))}" selected></option>`;

load();
setInterval(() => { if (!document.hidden) load(); }, CONFIG.REFRESH_SECONDS * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
tickCountdown();
setInterval(tickCountdown, 1000);
</script>
</body>
</html>
