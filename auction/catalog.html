<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="theme-color" content="#f6f0dc">
<title>รายการของ — ตลาดน้ำจิตต์น้ำใจ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --paper:#f6f0dc;
  --paper-2:#fffaf0;
  --line:#eadfc2;
  --ink:#3b2f27;
  --dim:#857766;
  --red:#e2553f;
  --red-deep:#c23b28;
  --olive:#7f8f52;
  --olive-soft:#eef0dc;
  --lemon:#e9ea8c;
  --lemon-2:#f2f2b4;
  --ring:#a3a9c6;
  --wood:#9a4423;
  --shadow:0 5px 0 rgba(59,47,39,.09);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:"Sarabun",-apple-system,"Segoe UI",Tahoma,sans-serif;
  font-size:16px;line-height:1.5;font-variant-numeric:tabular-nums;overflow-x:hidden;
}
a{color:var(--red-deep)}
button{font:inherit;cursor:pointer}
.hand{font-family:"Mali","Sarabun",cursive}

.bunting{display:block;width:100%;height:64px}
.shell{max-width:1120px;margin:0 auto;padding:0 16px}

header{text-align:center;padding:4px 0 8px}
.event{margin:0;color:var(--olive);font-size:clamp(18px,4.4vw,24px);font-weight:600}
h1{margin:2px 0 4px;font-size:clamp(30px,8vw,48px);line-height:1.15;color:var(--red);font-weight:700}
.lead{margin:0 auto;color:var(--dim);max-width:520px}

/* ---------- tools ---------- */
.tools{display:flex;justify-content:flex-end;margin:16px 0 10px}
.tools input{
  font:inherit;font-size:14px;padding:7px 10px;border-radius:10px;border:2px solid var(--line);
  background:var(--paper-2);color:var(--ink);min-width:0;width:min(320px,100%)
}

.banner{margin:12px 0;padding:10px 14px;border-radius:14px;font-size:14px}
.banner.err{background:#fbe6e2;color:#8c2618;border:2px solid #f3c2b8}
.banner.info{background:var(--olive-soft);color:#4f5a2f;border:2px solid #d9ddb5}
.banner:empty{display:none}

/* ---------- item cards: same poster card as the live board (index.html), without the price box ---------- */
.lots{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:22px;margin:10px 0 0;padding:0;list-style:none}
.lot{
  position:relative;background:var(--paper-2);border-radius:22px;padding:18px 14px 14px;
  box-shadow:0 6px 0 rgba(59,47,39,.10);border:2px solid var(--line);display:flex;flex-direction:column
}
.photo{
  position:relative;display:block;width:150px;height:150px;margin:0 auto;border-radius:50%;padding:0;
  border:7px solid var(--ring);background:#fff;overflow:visible
}
button.photo{cursor:zoom-in}
.photo .inner{width:100%;height:100%;border-radius:50%;overflow:hidden;display:grid;place-items:center}
.nophoto{color:var(--dim);font-size:15px;font-weight:600}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo .count{position:absolute;right:-8px;top:4px;z-index:3;background:var(--ink);color:#fff;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.bow{position:absolute;right:-18px;top:84px;width:38px;height:32px;transform:rotate(20deg);z-index:3}
/* the red-hood girl stands beside each photo circle; the photo stays centred and she shrinks to fit on its left */
.stage{display:grid;grid-template-columns:1fr auto 1fr;align-items:end}
.stage .photo{grid-column:2}
.buddy{grid-column:1;grid-row:1;justify-self:end;width:112px;max-width:100%;margin:0 2px -10px 0;pointer-events:none}
.buddy .hood{display:block;width:100%;height:auto;animation:sway 3.6s ease-in-out infinite;transform-origin:50% 100%}
.lot:nth-child(2n) .buddy .hood{animation-delay:-1.8s;animation-duration:4.2s}
.lot:nth-child(3n) .buddy .hood{animation-delay:-.9s}
@keyframes sway{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-3px) rotate(1.5deg)}}
.plank{
  position:relative;z-index:1;align-self:center;margin:14px 0 -12px;padding:4px 18px 6px;
  background:linear-gradient(180deg,#b9592e,var(--wood));color:#fff6ea;
  border-radius:8px 14px 9px 12px;transform:rotate(-2deg);box-shadow:0 3px 0 rgba(0,0,0,.15);
  font-family:"Mali",cursive;font-weight:600;font-size:15px
}
.plank b{font-size:20px;margin-left:4px}
.board{
  background:var(--lemon);border:7px solid var(--wood);border-radius:6px;
  padding:20px 14px 14px;flex:1;display:flex;flex-direction:column;gap:6px
}
.board h2{margin:0;font-family:"Mali",cursive;font-size:20px;line-height:1.3}
.desc{margin:0;font-size:14px;color:#5b4f3d;white-space:pre-line}
.donor{margin:0;font-size:13px;color:#6d6047}
.empty{grid-column:1 / -1;color:var(--dim);text-align:center;padding:32px 0}

/* ---------- more photos + photo viewer ---------- */
.more{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.more button{width:50px;height:50px;padding:0;border-radius:10px;border:2px solid var(--wood);background:#fff;overflow:hidden;cursor:zoom-in}
.more img{width:100%;height:100%;object-fit:cover;display:block}
.viewer{position:fixed;inset:0;z-index:20;background:rgba(30,24,20,.92);display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:10px;padding:16px}
.viewer[hidden]{display:none}
.viewer img{max-width:100%;max-height:calc(100vh - 120px);object-fit:contain;border-radius:8px;background:#fff}
.viewer .bar{display:flex;gap:10px;align-items:center;color:#fff6ea;font-weight:600}
.viewer .bar button{border:2px solid #fff6ea;background:none;color:#fff6ea;border-radius:10px;padding:6px 14px;font-size:18px}
.viewer .bar button[hidden]{display:none}

/* phones: a more compact card, like the board */
@media (max-width:560px){
  .lots{gap:16px}
  .lot{padding:12px;border-radius:18px}
  .photo{width:118px;height:118px;border-width:6px}
  .bow{right:-14px;top:66px;width:30px;height:25px}
  .buddy{width:100px}
  .plank{margin:10px 0 -10px;font-size:13px;padding:3px 14px 5px}
  .plank b{font-size:17px}
  .board{border-width:6px;padding:16px 12px 12px;gap:4px}
  .board h2{font-size:18px}
  .desc{font-size:13px}
  .donor{font-size:12px}
}
@media (prefers-reduced-motion:reduce){.buddy .hood{animation:none}}

footer{color:var(--dim);font-size:13px;text-align:center;padding:18px 16px 28px}

@media print{
  .bunting,.tools,.banner,.viewer,footer{display:none!important}
  body{background:#fff}
  .lot{box-shadow:none;break-inside:avoid}
}
</style>
</head>
<body>
<script src="auction-core.js?v=20261012"></script>
<script src="girl.js?v=20261011b"></script>
<script>
// The loading screen is worded for the auction; this page has no bids or prices
(function(){
  const t = document.querySelectorAll("#girlLoader .gl-scene > text");
  if (t.length < 4) return;
  t[1].textContent = "รายการของทั้งหมด";
  t[2].firstChild.textContent = "กำลังเดินเลือกของ";
  t[3].textContent = "รอแป๊บนึงนะ กำลังโหลดรายการ";
})();
</script>

<svg class="bunting" viewBox="0 0 1200 46" preserveAspectRatio="none" aria-hidden="true">
  <path d="M0 4 Q600 34 1200 4" fill="none" stroke="#e2553f" stroke-width="3"/>
  <g id="flags"></g>
</svg>

<div class="shell">
  <header>
    <p class="event hand" id="eventName">ตลาดน้ำจิตต์น้ำใจ #25</p>
    <h1 class="hand">รายการของทั้งหมด</h1>
    <p class="lead" id="lead">ของทุกชิ้นในงาน กดที่รูปเพื่อดูภาพใหญ่</p>
  </header>

  <div class="banner err" id="errBanner"></div>
  <div class="banner info" id="infoBanner"></div>

  <div class="tools">
    <div class="right">
      <input type="search" id="q" placeholder="ค้นหาชื่อของ…" aria-label="ค้นหา">
    </div>
  </div>

  <ul class="lots" id="list"><li class="empty">กำลังโหลดรายการ…</li></ul>
</div>

<div class="viewer" id="viewer" hidden role="dialog" aria-modal="true" aria-label="ดูรูป">
  <img id="viewerImg" alt="" referrerpolicy="no-referrer">
  <div class="bar">
    <button type="button" id="vPrev" aria-label="รูปก่อนหน้า">‹</button>
    <span id="vCount"></span>
    <button type="button" id="vNext" aria-label="รูปถัดไป">›</button>
    <button type="button" id="vClose" aria-label="ปิด">✕</button>
  </div>
</div>

<footer class="shell">
  อัปเดตเองทุก <span id="every">2 นาที</span> · อัปเดตล่าสุด <span id="updated">–</span>
</footer>

<script>
"use strict";
/* Plain item list: the same "Items" tab as the auction, without prices, bids or the form.
   See auction/README.md §5e */

let items = null, loading = false;

const BOW = bowSvg("bow");

function rowHtml(it, i){
  const img = it.image
    ? `<img src="${esc(it.image)}" alt="${esc(it.name)}" loading="lazy" referrerpolicy="no-referrer" onerror="${imgFallback}">`
    : NO_PHOTO;
  const inner = `<div class="inner">${img}</div>${BOW}${it.images.length > 1 ? `<span class="count">📷 ${it.images.length}</span>` : ""}`;
  const photo = it.images.length
    ? `<button type="button" class="photo" data-key="${esc(it.key)}" data-i="0" aria-label="ดูรูป ${esc(it.name)}">${inner}</button>`
    : `<div class="photo">${inner}</div>`;
  const more = it.images.length > 1
    ? `<div class="more">${it.images.map((p, n) =>
        `<button type="button" data-key="${esc(it.key)}" data-i="${n}" aria-label="รูปที่ ${n + 1}">
           <img src="${esc(p.thumb)}" alt="" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></button>`).join("")}</div>`
    : "";
  return `<li class="lot" id="item-${esc(it.key)}">
    <div class="stage"><div class="buddy">${hoodImg((parseInt(it.no, 10) || i + 1) - 1)}</div>${photo}</div>
    <div class="plank">Item no.<b>${esc(it.no ? it.no.padStart(2, "0") : "–")}</b></div>
    <div class="board">
      <h2>${esc(it.name)}</h2>
      ${it.desc ? `<p class="desc">${esc(it.desc)}</p>` : ""}
      ${it.donor ? `<p class="donor">💝 บริจาคโดย ${esc(it.donor)}</p>` : ""}
      ${more}
    </div>
  </li>`;
}

function render(){
  const q = norm($("q").value).toLowerCase();
  const num = it => parseInt(it.no, 10) || 9999;
  const rows = items
    .filter(it => !q || [it.name, it.desc, it.donor, it.no].join(" ").toLowerCase().includes(q))
    .sort((a, b) => num(a) - num(b));
  $("list").innerHTML = rows.length ? rows.map(rowHtml).join("")
    : `<li class="empty">${items.length ? "ไม่พบของที่ค้นหา" : `ยังไม่มีรายการ เพิ่มของในแท็บ ${esc(CONFIG.ITEMS_SHEET)} ของชีท`}</li>`;
  $("lead").textContent = `ของทั้งหมด ${items.length} ชิ้นในงาน กดที่รูปเพื่อดูภาพใหญ่`;
  $("infoBanner").textContent = DEMO
    ? "โหมดตัวอย่าง: ข้อมูลในหน้านี้เป็นข้อมูลสมมติ ใส่ SHEET_ID ใน auction-core.js เพื่อเชื่อมกับชีทจริง" : "";
}

async function load(){
  if (loading) return;
  loading = true;
  try {
    const grid = DEMO ? demoGrids().items : await fetchGrid({ sheet:CONFIG.ITEMS_SHEET || "Items" });
    items = buildItems(grid);
    $("errBanner").textContent = "";
    $("updated").textContent = clock(new Date());
    // Don't wipe the list (and the search) under someone who is looking at a photo
    if ($("viewer").hidden) render();
  } catch (e) {
    $("errBanner").textContent = `โหลดข้อมูลไม่สำเร็จ: ${e.message}` + (items ? " (แสดงข้อมูลล่าสุดที่โหลดได้)" : "");
  } finally {
    loading = false;
    GirlLoader.done();
  }
}

/* ---------- photo viewer ---------- */
let vItem = null, vAt = 0;
function showPhoto(){
  const n = vItem.images.length;
  $("viewerImg").src = vItem.images[vAt].full;
  $("vCount").textContent = n > 1 ? `${vAt + 1} / ${n}` : "";
  $("vPrev").hidden = $("vNext").hidden = n < 2;
}
function openViewer(key, i){
  vItem = items.find(it => it.key === key);
  if (!vItem || !vItem.images.length) return;
  vAt = i; showPhoto();
  $("viewer").hidden = false;
}
function step(d){ if (vItem) { vAt = (vAt + d + vItem.images.length) % vItem.images.length; showPhoto(); } }
function closeViewer(){ $("viewer").hidden = true; $("viewerImg").removeAttribute("src"); vItem = null; }

$("list").addEventListener("click", e => {
  const b = e.target.closest("button[data-key]");
  if (b) openViewer(b.dataset.key, +b.dataset.i);
});
$("vPrev").addEventListener("click", () => step(-1));
$("vNext").addEventListener("click", () => step(1));
$("vClose").addEventListener("click", closeViewer);
$("viewer").addEventListener("click", e => { if (e.target.id === "viewer") closeViewer(); });
document.addEventListener("keydown", e => {
  if ($("viewer").hidden) return;
  if (e.key === "Escape") closeViewer();
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
});

(function drawBunting(){
  const colors = ["#e2553f", "#e9ea8c", "#7f8f52", "#e8774d", "#f3a7a3"];
  let html = "";
  for (let i = 0; i < 30; i++) {
    const x = i * 40 + 4, t = (x + 15) / 1200, y = 4 + 60 * t * (1 - t);
    html += `<path d="M${x} ${y.toFixed(1)} L${x + 30} ${y.toFixed(1)} L${x + 15} ${(y + 32).toFixed(1)} Z" fill="${colors[i % colors.length]}" opacity=".92"/>`;
  }
  $("flags").innerHTML = html;
})();

$("eventName").textContent = CONFIG.EVENT_NAME;
$("every").textContent = refreshLabel();
$("q").addEventListener("input", () => items && render());

load();
setInterval(() => { if (!document.hidden) load(); }, CONFIG.REFRESH_SECONDS * 1000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
</script>
</body>
</html>
